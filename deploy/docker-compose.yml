# Remote SQL Agent control plane — production deployment.
#
# No checkout required. On a bare host with Docker:
#
#   curl -fsSLO https://raw.githubusercontent.com/semics-tech/remote-sql-agent/main/deploy/docker-compose.yml
#   curl -fsSLO https://raw.githubusercontent.com/semics-tech/remote-sql-agent/main/deploy/Caddyfile
#   curl -fsSL  https://raw.githubusercontent.com/semics-tech/remote-sql-agent/main/deploy/.env.example -o .env
#   # edit .env, then:
#   docker compose up -d
#
# One container plus Postgres, both pulled. The dashboard is served by the API
# process, so there is nothing else to run.
#
# Ports: 8080 is the dashboard and REST API, 8443 is the worker hub. Workers
# dial *out* to 8443, so that is the only port that needs to be reachable from
# the SQL Server network segments — and nothing needs to reach the workers.
#
# To terminate HTTPS here as well, with a certificate obtained and renewed
# automatically:
#
#   docker compose --profile tls up -d
#
# That needs RSAGENT_DOMAIN set, ports 80 and 443 reachable, and — so the
# dashboard is not also served insecurely on a second origin —
# RSAGENT_HTTP_BIND=127.0.0.1. See .env.example and docs/deployment.md.

name: rsagent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rsagent}
    volumes:
      # Job definitions routinely contain connection strings. Put this on an
      # encrypted volume and encrypt your backups — see docs/security.md.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rsagent} -d ${POSTGRES_DB:-rsagent}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the control plane needs it.
    expose:
      - '5432'
    security_opt:
      - no-new-privileges:true
    # Not cap_drop: [ALL] — verified against this image directly. The official
    # entrypoint starts as root, chmods and chowns the data directory, then
    # switches to the postgres user via gosu (setuid/setgid); dropping ALL
    # makes every one of those fail on first start ("Operation not permitted",
    # "failed switching to 'postgres'"). no-new-privileges alone is still real
    # containment — it blocks the container from gaining privileges beyond
    # what it started with — and does not touch this path.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  server:
    # Pulled, never built. This file used to carry a `build:` stanza pointing at
    # `..`, which quietly made a git checkout a prerequisite for deploying — so
    # standing up a control plane meant cloning the whole repository onto a
    # production host and compiling there. The published image is the artefact.
    #
    # ghcr.io/semics-tech/remote-sql-agent/control-plane is the same image at
    # the same digest if you prefer GitHub's registry.
    image: ${RSAGENT_IMAGE:-techsemics/remote-sql-agent}:${RSAGENT_VERSION:?set RSAGENT_VERSION in .env — see the comment on it in .env.example}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RSAGENT_DATABASE_URL: postgres://${POSTGRES_USER:-rsagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rsagent}
      RSAGENT_PUBLIC_URL: ${RSAGENT_PUBLIC_URL:?set RSAGENT_PUBLIC_URL in .env}
      RSAGENT_LOG_LEVEL: ${RSAGENT_LOG_LEVEL:-info}
      # 0 unless something terminates TLS in front of this. See .env.example.
      RSAGENT_TRUSTED_PROXY_HOPS: ${RSAGENT_TRUSTED_PROXY_HOPS:-0}
      # Only needed when the hub is not reachable at RSAGENT_PUBLIC_URL's host
      # on 8443 — including when RSAGENT_GRPC_PORT below remaps the published
      # port, which the container never sees.
      RSAGENT_HUB_ADVERTISED_ADDRESS: ${RSAGENT_HUB_ADVERTISED_ADDRESS:-}
      # Unset leaves /metrics open. See .env.example.
      RSAGENT_METRICS_TOKEN: ${RSAGENT_METRICS_TOKEN:-}

      # --- Dashboard identity (docs/authentication.md §1) ---
      RSAGENT_AUTH_MODE: ${RSAGENT_AUTH_MODE:-local}
      RSAGENT_BOOTSTRAP_ADMIN: ${RSAGENT_BOOTSTRAP_ADMIN:-admin}
      RSAGENT_BOOTSTRAP_ADMIN_PASSWORD: ${RSAGENT_BOOTSTRAP_ADMIN_PASSWORD:-}
      RSAGENT_ENTRA_TENANT_ID: ${RSAGENT_ENTRA_TENANT_ID:-}
      RSAGENT_ENTRA_CLIENT_ID: ${RSAGENT_ENTRA_CLIENT_ID:-}
      RSAGENT_ENTRA_CLIENT_SECRET: ${RSAGENT_ENTRA_CLIENT_SECRET:-}

      # --- Worker authentication (docs/authentication.md §2) ---
      RSAGENT_WORKER_AUTH_MODES: ${RSAGENT_WORKER_AUTH_MODES:-token}
      RSAGENT_GRPC_TLS_CERT: /etc/rsagent/tls/server.crt
      RSAGENT_GRPC_TLS_KEY: /etc/rsagent/tls/server.key

      # --- Audit export (docs/authentication.md §3) ---
      RSAGENT_AUDIT_OTLP_ENABLED: ${RSAGENT_AUDIT_OTLP_ENABLED:-false}
      RSAGENT_AUDIT_OTLP_ENDPOINT: ${RSAGENT_AUDIT_OTLP_ENDPOINT:-}
      RSAGENT_AUDIT_OTLP_HEADERS: ${RSAGENT_AUDIT_OTLP_HEADERS:-}

      # --- Trace export ---
      RSAGENT_TRACE_OTLP_ENABLED: ${RSAGENT_TRACE_OTLP_ENABLED:-false}
      RSAGENT_TRACE_OTLP_ENDPOINT: ${RSAGENT_TRACE_OTLP_ENDPOINT:-}
      RSAGENT_TRACE_OTLP_HEADERS: ${RSAGENT_TRACE_OTLP_HEADERS:-}
      RSAGENT_TRACE_SAMPLE_RATIO: ${RSAGENT_TRACE_SAMPLE_RATIO:-1}

      RSAGENT_REQUIRE_APPROVAL_JOB_WRITE: ${RSAGENT_REQUIRE_APPROVAL_JOB_WRITE:-true}
      RSAGENT_HISTORY_RETENTION_DAYS: ${RSAGENT_HISTORY_RETENTION_DAYS:-90}
    volumes:
      # Server certificate for the worker hub. Without it the control plane
      # refuses to start, because in token mode TLS is the only thing keeping
      # worker API keys off the wire.
      - ${RSAGENT_TLS_DIR:-./tls}:/etc/rsagent/tls:ro
    # Host side only — the container binds 8080 and 8443 regardless. Remapping
    # the hub here does not change the address the dashboard hands out, so set
    # RSAGENT_HUB_ADVERTISED_ADDRESS to match if you do.
    #
    # RSAGENT_HTTP_BIND exists for the `tls` profile: set it to 127.0.0.1 so the
    # dashboard is reachable only through Caddy. Leaving it open would serve the
    # same dashboard over plain HTTP on a second origin, where the browser
    # refuses to encrypt SQL credentials and the field just disables itself.
    ports:
      - '${RSAGENT_HTTP_BIND:-0.0.0.0}:${RSAGENT_HTTP_PORT:-8080}:8080'
      - '${RSAGENT_GRPC_PORT:-8443}:8443'
    # Matches deploy/k8s/control-plane.yaml's securityContext — same image,
    # same guarantee. The container already runs as `node` (see the Dockerfile)
    # and writes nothing to disk itself; the one thing that needs a writable
    # path is tsx caching its TypeScript transforms under /tmp, which the tmpfs
    # mount below covers without giving up the read-only root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Only started by `docker compose --profile tls up -d`.
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Not `:?` — Compose interpolates every service whether its profile is
      # active or not, so a required-variable marker here would break plain
      # `docker compose up -d` for everyone not using this profile.
      #
      # Left unset, Caddy refuses to start, but says `unrecognized global
      # option: encode` rather than anything about a domain: an empty site
      # address turns the block into a global options block, and the first
      # directive inside it is what it complains about. Set RSAGENT_DOMAIN.
      RSAGENT_DOMAIN: ${RSAGENT_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume is not fatal but
      # means re-issuing on next start, which counts against rate limits.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'
    # Verified against this image: NET_BIND_SERVICE is the one capability
    # caddy needs beyond a default-non-root process, to bind 80/443. Everything
    # else it does is inside the two volumes above, so cap_drop: [ALL] plus
    # that one add is a full lockdown rather than a partial one.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
  caddy-data:
  caddy-config:
