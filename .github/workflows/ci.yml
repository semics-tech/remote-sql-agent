name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  # Node 24 is the current LTS ("Krypton"). Deliberately not 26: that is the
  # Current line, and the worker ships a bundled runtime onto customer database
  # servers, where a line that takes breaking changes is the wrong trade.
  NODE_VERSION: '24'

jobs:
  build:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    services:
      # The server unit tests exercise version allocation under concurrency and
      # ON CONFLICT idempotency, which are not meaningfully testable against a
      # mock. Each test file provisions its own database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsagent
          POSTGRES_PASSWORD: rsagent_dev_password
          POSTGRES_DB: rsagent
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rsagent -d rsagent"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The .proto files are the source of truth; generated output is checked in
      # so contributors need no protoc toolchain. Fail if the two have diverged.
      - name: Check generated protobuf is current
        run: pnpm proto:check

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit
        env:
          RSAGENT_TEST_ADMIN_URL: postgres://rsagent:rsagent_dev_password@localhost:5433/rsagent

      - name: Build dashboard
        run: pnpm --filter @remote-sql-agent/dashboard build

      - name: Build the worker bundle
        run: pnpm --filter @remote-sql-agent/worker bundle

      # The bundle marks nothing external and ships with no node_modules beside
      # it — that is what the tarball, the SEA executables and `npm i -g` all
      # rely on. Running it from inside the repo would pass even if a dependency
      # had been marked --external, because node would resolve it from the
      # workspace's own node_modules by accident. Copying it to a bare directory
      # first is the only way this check can fail honestly.
      - name: Self-test the worker bundle from a bare directory
        run: |
          set -euo pipefail
          bare="$(mktemp -d)"
          cp packages/worker/dist/rsagent-worker.mjs "$bare/"
          (cd "$bare" && node rsagent-worker.mjs --rsagent-selftest)

  integration:
    name: Integration (SQL Server + Postgres)
    runs-on: ubuntu-latest
    # Slow (real SQL Server, real job runs) but it is the only thing that proves
    # round-trip fidelity and drift attribution actually work.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsagent
          POSTGRES_PASSWORD: rsagent_dev_password
          POSTGRES_DB: rsagent
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rsagent -d rsagent"
          --health-interval 5s --health-timeout 5s --health-retries 20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'RsAgent_Dev_Pass123'
          MSSQL_PID: Developer
          MSSQL_AGENT_ENABLED: 'true'
          # Without this SQL Server sizes its buffer pool against the whole
          # runner and gets OOM-killed.
          MSSQL_MEMORY_LIMIT_MB: '2048'
        ports: ['14330:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 90s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed fixture Agent jobs
        run: |
          docker exec "${{ job.services.sqlserver.id }}" mkdir -p /tmp/seed
          docker cp deploy/sql-seed/seed.sql "${{ job.services.sqlserver.id }}:/tmp/seed.sql"
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RsAgent_Dev_Pass123' -C -b -i /tmp/seed.sql

      - run: pnpm test:integration
        env:
          RSAGENT_TEST_ADMIN_URL: postgres://rsagent:rsagent_dev_password@localhost:5433/rsagent
          RSAGENT_TEST_SQL_HOST: localhost
          RSAGENT_TEST_SQL_PORT: '14330'

  container:
    name: Control plane image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Dashboard (browser)
    runs-on: ubuntu-latest
    # Nothing else in the repository renders a component: the unit tests cover
    # pure functions and the integration suite stops at the API. Without this,
    # a React, Vite or Monaco upgrade can break every screen with CI green.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium: these test this application's behaviour, not browser
      # compatibility, and three engines would triple the runtime to re-prove
      # the same assertions.
      - name: Install Playwright browser
        run: pnpm --filter @remote-sql-agent/dashboard exec playwright install --with-deps chromium

      # Builds the dashboard and serves it — see playwright.config.ts. The API
      # is stubbed per test, so this needs no Postgres and no SQL Server.
      - run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supply-chain mitigation from the threat model.
      - run: pnpm audit --audit-level high
