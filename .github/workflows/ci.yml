name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §10: the .proto files are the source of truth. Fail if the checked-in
      # generated output has drifted from them.
      - name: Check generated protobuf is current
        run: pnpm proto:check

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm --filter @rsagent/dashboard build

  integration:
    name: Integration (SQL Server + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsagent
          POSTGRES_PASSWORD: rsagent_dev_password
          POSTGRES_DB: rsagent
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rsagent -d rsagent"
          --health-interval 5s --health-timeout 5s --health-retries 20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'RsAgent_Dev_Pass123'
          MSSQL_PID: Developer
          MSSQL_AGENT_ENABLED: 'true'
        ports: ['14330:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 60s

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          RSAGENT_DATABASE_URL: postgres://rsagent:rsagent_dev_password@localhost:5433/rsagent
      - run: pnpm test:integration
        env:
          RSAGENT_DATABASE_URL: postgres://rsagent:rsagent_dev_password@localhost:5433/rsagent
          RSAGENT_TEST_SQL_HOST: localhost
          RSAGENT_TEST_SQL_PORT: '14330'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # §6.7 supply-chain mitigation.
      - run: pnpm audit --audit-level high
