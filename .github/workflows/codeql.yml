name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published rules find old code rather than waiting for
    # someone to touch it.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          # security-extended adds the injection and auth-bypass queries, which
          # are exactly the classes that matter for a product that writes to
          # customer database servers.
          queries: security-extended

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: '/language:javascript-typescript'
