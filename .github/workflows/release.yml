name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  # Nothing is published until the same checks that guard main have passed on
  # the tagged commit. A release that skips CI is how a broken worker reaches
  # 50 production database servers.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsagent
          POSTGRES_PASSWORD: rsagent_dev_password
          POSTGRES_DB: rsagent
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rsagent -d rsagent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
        env:
          RSAGENT_TEST_ADMIN_URL: postgres://rsagent:rsagent_dev_password@localhost:5433/rsagent

      # The tag must match what the packages actually say their version is,
      # or npm and the git history disagree forever.
      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/protocol packages/worker; do
            VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::$pkg is version $VERSION but the tag is v$TAG."
              exit 1
            fi
          done
          echo "All packages are at $TAG."

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # protocol first: worker depends on it, and pnpm rewrites the
      # workspace:* range to the real version at publish time.
      - name: Publish @remote-sql-agent/protocol
        run: |
          pnpm --filter @remote-sql-agent/protocol publish \
            --access public --no-git-checks --provenance \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @remote-sql-agent/worker
        run: |
          pnpm --filter @remote-sql-agent/worker publish \
            --access public --no-git-checks --provenance \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  container:
    name: Publish control plane image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/control-plane
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # amd64 and arm64: the control plane is frequently run on Graviton or
          # Apple Silicon even where the SQL Servers are not.
          platforms: linux/amd64,linux/arm64
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  worker-package:
    name: Build worker distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The zip is what install.ps1 consumes. The Node runtime and the WinSW
      # binary are fetched here rather than vendored into the repository.
      - name: Assemble
        run: pnpm --filter @remote-sql-agent/worker package -- --no-runtime

      - name: Fetch pinned Node runtime for Windows
        run: |
          NODE_FULL="v22.20.1"
          curl -fsSL "https://nodejs.org/dist/${NODE_FULL}/node-${NODE_FULL}-win-x64.zip" -o node-win.zip
          unzip -q node-win.zip
          mkdir -p packages/worker/dist/package/node
          cp "node-${NODE_FULL}-win-x64/node.exe" packages/worker/dist/package/node/
          cp "node-${NODE_FULL}-win-x64/LICENSE" packages/worker/dist/package/node/

      - name: Fetch WinSW
        run: |
          curl -fsSL https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe \
            -o packages/worker/dist/package/rsagent-worker.exe

      - name: Zip
        run: |
          cd packages/worker/dist/package
          zip -qr "../../../../rsagent-worker-${GITHUB_REF_NAME:-dev}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: worker-distribution
          path: rsagent-worker-*.zip
          retention-days: 90

  github-release:
    name: GitHub release
    needs: [npm, container, worker-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: worker-distribution

      - uses: softprops/action-gh-release@v2
        with:
          files: rsagent-worker-*.zip
          generate_release_notes: true
          body: |
            ## Install

            **Control plane**

            ```bash
            docker pull ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
            ```

            **Worker** — download the zip below and run `install.ps1` from an
            elevated PowerShell, or on Linux:

            ```bash
            npm install -g @remote-sql-agent/worker@${{ github.ref_name }}
            ```

            See [the quick start](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/quick-start.md).

            ---
