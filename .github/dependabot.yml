version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Pull request titles are checked against the conventional commit format
    # and are what lands on main, so dependabot has to title its own the same
    # way. Without a prefix it opens "Bump x from 1 to 2", which fails.
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      # One PR for the routine churn; anything major still comes separately so
      # it gets read properly.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # argon2 is the last native module in the tree, and it hashes every
      # credential. A major bump gets read by a person, not merged by a bot.
      - dependency-name: argon2
        update-types: ['version-update:semver-major']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    labels: ['dependencies', 'ci']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docker)
    labels: ['dependencies']
