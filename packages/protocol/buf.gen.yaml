version: v2
managed:
  enabled: false
plugins:
  - local: ../../node_modules/.bin/protoc-gen-ts_proto
    out: src/gen
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - useOptionals=messages
      - useDate=false
      - oneof=unions
      - importSuffix=.js
      - snakeToCamel=true
inputs:
  - directory: proto
